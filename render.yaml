databases:
  - name: ayakbine-postgres
    plan: free
    databaseName: jeko_wallet
    user: jeko_wallet_user

services:
  - type: web
    name: ayakbine-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ayakbine-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false # à remplir manuellement avec l'URL de ton addon Redis (voir README)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: JEKO_BASE_URL
        sync: false
      - key: JEKO_API_KEY
        sync: false
      - key: JEKO_MERCHANT_ID
        sync: false
      - key: JEKO_WEBHOOK_SECRET
        sync: false
      - key: JEKO_TIMEOUT_SECONDS
        value: "15"
      - key: PUBLIC_BASE_URL
        sync: false # à définir après le 1er déploiement avec l'URL Render générée
      - key: SMS_PROVIDER
        value: console
      - key: SMS_TIMEOUT_SECONDS
        value: "10"
      - key: RUN_INIT_DB
        value: "false" # passer à "true" temporairement au tout premier déploiement
